<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<link rel="manifest" href="/my-crm/manifest.webmanifest">
<title>Записи мастера</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#8a909a; --line:#eceef2;
    --accent:#2f6bff; --green:#1fa971; --green-soft:#e6f7ef;
    --orange:#e08a00; --orange-soft:#fdf3e2; --red:#e04545; --radius:14px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.4; }
  #app { max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:84px; position:relative; }
  header { position:sticky; top:0; z-index:10; background:var(--bg);
    padding:14px 16px 10px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; font-weight:700; }
  .hdr-btn { border:1px solid var(--line); background:var(--card);
    width:40px; height:40px; border-radius:12px; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--text); }
  .hdr-add-btn {
    border: none;
    background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
    color: #fff;
    height: 40px; padding: 0 14px; border-radius: 12px;
    font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer; display: flex; align-items: center; gap: 5px;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(16,185,129,.35);
  }
  .hdr-add-btn .plus { font-size: 18px; line-height: 1; font-weight: 700; }
  .hdr-add-btn:active { transform: scale(.97); }

  .week-strip { display:flex; gap:6px; padding:0 16px 10px; overflow-x:auto;
    scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .week-strip::-webkit-scrollbar { display:none; }
  .day-btn { flex:0 0 auto; min-width:52px; padding:8px 4px; border-radius:12px;
    border:1px solid var(--line); background:var(--card); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px; font-family:inherit; }
  .day-btn .wd { font-size:11px; color:var(--muted); font-weight:600; }
  .day-btn .d { font-size:16px; font-weight:700; color:var(--text); }
  .day-btn .cnt { font-size:10px; color:var(--accent); font-weight:600; min-height:12px; }
  .day-btn.active { background:var(--accent); border-color:var(--accent); }
  .day-btn.active .wd, .day-btn.active .d, .day-btn.active .cnt { color:#fff; }
  .day-btn.today .d { color:var(--accent); }
  .day-btn.today.active .d { color:#fff; }
  .day-btn.weekend:not(.active) .d { color: var(--red); }
  .day-btn.weekend:not(.active) .wd { color: var(--red); opacity:.75; }

  .datebar { display:flex; align-items:center; gap:8px; padding:0 16px 10px; }
  .datebar .label { flex:1; text-align:center; font-weight:600; font-size:14px; }

  .voice-hero {
    display: flex; align-items: center; gap: 14px;
    margin: 4px 16px 14px; padding: 16px 18px;
    background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
    color: #fff; border: none; border-radius: 16px;
    font-family: inherit; text-align: left; cursor: pointer;
    box-shadow: 0 8px 24px rgba(16,185,129,.35);
    animation: heroPulse 2.5s ease-in-out infinite;
    position: relative; overflow: hidden;
  }
  .voice-hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,.2) 50%, transparent 100%);
    transform: translateX(-100%);
    animation: heroShine 3s ease-in-out infinite;
  }
  @keyframes heroPulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(16,185,129,.35); }
    50% { box-shadow: 0 8px 32px rgba(6,182,212,.55); }
  }
  @keyframes heroShine {
    0%, 60% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .voice-hero:active { transform: scale(.98); }
  .vh-text { display: flex; flex-direction: column; gap: 3px; flex: 1; position: relative; z-index: 1; }
  .vh-title { font-size: 16px; font-weight: 700; letter-spacing: .2px; }
  .vh-hint { font-size: 12px; opacity: .9; font-weight: 500; }
  .vh-icon {
    font-size: 32px; flex-shrink: 0;
    background: rgba(255,255,255,.22); width: 52px; height: 52px;
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 1;
  }

  .list { padding:0 16px; display:flex; flex-direction:column; gap:10px; }
  .card { background:var(--card); border-radius:var(--radius); padding:14px;
    border:1px solid var(--line); display:flex; flex-direction:column; gap:8px;
    margin:0 16px; }
  .list .card { margin:0; }
  .card .top { display:flex; align-items:baseline; gap:10px; }
  .card .time { font-weight:700; font-size:15px; min-width:50px; }
  .card .name { font-weight:600; flex:1; }
  .card .sub { color:var(--muted); font-size:13px; }
  .card .price { font-weight:600; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-size:12px; padding:3px 8px; border-radius:999px; font-weight:600; }
  .chip.green { background:var(--green-soft); color:var(--green); }
  .chip.orange { background:var(--orange-soft); color:var(--orange); }
  .chip.gray { background:var(--line); color:var(--muted); }
  .summary { margin:14px 16px 0; padding:14px; background:var(--card);
    border-radius:var(--radius); border:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; font-size:14px; }
  .summary b { font-size:16px; }

  .remind-block { margin:14px 16px 0; padding:14px; background:#fff8e6;
    border-radius:var(--radius); border:1px solid #f0e0b0; }
  .remind-block .t { font-size:12px; font-weight:700; color:var(--orange); margin-bottom:8px; }
  .remind-item { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:14px; }
  .remind-item .who { flex:1; }
  .remind-item button { background:var(--orange); color:#fff; border:none;
    padding:6px 10px; border-radius:8px; font-size:12px; font-weight:600; font-family:inherit; cursor:pointer; }

  .fab { position:fixed; bottom:92px; right:max(16px, calc(50% - 224px));
    background:var(--accent); color:#fff; border:none; padding:14px 20px;
    border-radius:999px; font-size:15px; font-weight:600;
    box-shadow:0 8px 20px rgba(47,107,255,.35); z-index:20; font-family:inherit; cursor:pointer; }
  nav { position:fixed; bottom:0; left:0; right:0; z-index:15;
    background:rgba(255,255,255,.96); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); display:flex; justify-content:center; }
  nav .inner { max-width:480px; width:100%; display:flex; }
  nav button { flex:1; background:none; border:none; padding:12px 0 14px;
    font-size:11px; color:var(--muted); font-weight:600; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
  nav button.active { color:var(--accent); }
  nav button .ico { font-size:18px; }
  .empty { text-align:center; color:var(--muted); padding:40px 20px; font-size:14px; }
  .money-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px; }
  .money-tile { background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px; }
  .money-tile .k { color:var(--muted); font-size:12px; margin-bottom:6px; }
  .money-tile .v { font-size:20px; font-weight:700; }
  .money-tile.full { grid-column:1 / -1; }
  .money-tile.warn .v { color:var(--orange); }

  .client-card { position:relative; padding-right:44px; cursor:pointer; }
  .client-del {
    position:absolute; top:8px; right:8px;
    border:none; background:transparent; color:var(--muted);
    font-size:18px; cursor:pointer; padding:8px 12px; border-radius:8px;
    line-height:1;
  }
  .client-del:active { color:var(--red); background:#fdecec; }

  .client-header-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px 12px; gap:10px;
  }
  .client-title { font-size:20px; font-weight:700; flex:1; line-height:1.2; }

  .client-contacts {
    margin:0 16px 10px; padding:14px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  }
  .client-contacts .row { margin-bottom:10px; }
  .client-contacts .row:last-of-type { margin-bottom:10px; }
  .client-contacts label { display:block; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:4px; text-transform:uppercase; letter-spacing:.3px; }
  .client-contacts input { width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:15px; background:#fff; color:var(--text); }

  .voice-mini-btn {
    width:100%; padding:14px 16px;
    background:linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
    color:#fff; border:none; border-radius:12px;
    font-size:15px; font-weight:700; font-family:inherit;
    cursor:pointer; box-shadow:0 4px 12px rgba(16,185,129,.35);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .voice-mini-btn:active { transform:scale(.98); }

  .client-stats {
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    padding:0 16px; margin-top:4px;
  }
  .stat-tile {
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px;
  }
  .stat-tile.full { grid-column:1 / -1; }
  .stat-tile .k { color:var(--muted); font-size:12px; margin-bottom:6px; }
  .stat-tile .v { font-size:18px; font-weight:700; }

  .del-client-btn {
    width:100%; padding:18px 20px;
    background:var(--red);
    color:#fff; border:none; border-radius:14px;
    font-size:16px; font-weight:700; font-family:inherit;
    cursor:pointer; letter-spacing:.3px;
    box-shadow:0 6px 18px rgba(224,69,69,.4);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .del-client-btn:active { transform:scale(.98); background:#c93b3b; }

  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:30;
    display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:#fff; width:100%; max-width:480px;
    border-radius:20px 20px 0 0; padding:18px 18px 24px;
    max-height:90vh; overflow-y:auto; animation:up .18s ease; }
  @keyframes up { from { transform:translateY(30px); opacity:.5; } }
  .sheet h2 { margin:0 0 14px; font-size:17px; }
  .sheet .row { margin-bottom:12px; }
  .sheet label { display:block; font-size:12px; color:var(--muted);
    margin-bottom:5px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
  .sheet input, .sheet select, .sheet textarea { width:100%; padding:12px;
    border:1px solid var(--line); border-radius:10px; font-size:15px;
    font-family:inherit; background:#fff; color:var(--text); }
  .sheet textarea { resize:vertical; min-height:70px; }
  .sheet .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sheet .btn-row { display:flex; gap:10px; margin-top:16px; }
  .btn { flex:1; padding:14px; border-radius:12px; border:none;
    font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; }
  .btn.primary { background:var(--accent); color:#fff; }
  .btn.ghost { background:var(--line); color:var(--text); }
  .btn.danger { background:#fdecec; color:var(--red); }
  .btn.small { padding:10px; font-size:14px; }
  .sheet .actions { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .kv { display:flex; justify-content:space-between; padding:8px 0;
    border-bottom:1px solid var(--line); font-size:14px; }
  .kv:last-child { border-bottom:none; }
  .kv .k { color:var(--muted); }
  .kv .v { font-weight:600; }
  .history-item { display:flex; justify-content:space-between; padding:8px 0;
    font-size:14px; border-bottom:1px solid var(--line); }
  .history-item:last-child { border-bottom:none; }
  .voice-card { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .voice-top { display:flex; align-items:center; gap:10px; }
  .voice-play { width:44px; height:44px; border-radius:50%; border:none;
    background:var(--accent); color:#fff; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .voice-play.playing { background:var(--red); }
  .voice-meta { flex:1; }
  .voice-meta .who { font-weight:600; font-size:14px; }
  .voice-meta .when { color:var(--muted); font-size:12px; }
  .voice-del { background:none; border:none; color:var(--muted);
    font-size:18px; cursor:pointer; padding:4px 8px; }
  .voice-rec { display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px 0; }
  .rec-circle { width:96px; height:96px; border-radius:50%; border:none; background:var(--red);
    color:#fff; font-size:40px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; transition:transform .1s; box-shadow:0 8px 24px rgba(224,69,69,.35); }
  .rec-circle:active { transform:scale(.95); }
  .rec-circle.recording { animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(224,69,69,.5); } 50% { box-shadow:0 0 0 16px rgba(224,69,69,0); } }
  .rec-timer { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; }
  .rec-hint { color:var(--muted); font-size:13px; text-align:center; }
  .err-box { background:#fdecec; color:var(--red); padding:12px; border-radius:10px;
    font-size:13px; text-align:center; }
  .transcript-box { padding:10px; border:1px solid var(--line); border-radius:10px;
    font-size:14px; background:#f6f7f9; min-height:44px; color:var(--text); }
  .hint-green { font-size:12px; margin-top:6px; color:var(--green); }
  .hint-muted { font-size:12px; margin-top:6px; color:var(--muted); }

  .settings-section { padding:0 16px 14px; }
  .settings-section h3 { font-size:13px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.5px; margin:16px 0 8px; font-weight:700; }
  .settings-card { background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px; margin-bottom:10px; }
  .settings-card .desc { font-size:13px; color:var(--muted); margin-bottom:10px; }
  .vars { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .var-btn { font-size:12px; padding:4px 8px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); font-family:inherit; cursor:pointer; font-weight:600; }
  .menu-row { display:flex; align-items:center; justify-content:space-between;
    padding:14px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); margin-bottom:10px; font-size:15px; cursor:pointer; }
  .menu-row .arr { color:var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header id="header"></header>
  <main id="view"></main>
</div>
<div id="modal"></div>
<nav><div class="inner" id="tabs"></div></nav>

<script>
const LS_KEY = 'mini_crm_v1';
const IDB_NAME = 'mini_crm_audio';
const IDB_STORE = 'notes';
let db, state = { tab:'today', date:'', clientId:null };
let idb = null;

const DEFAULT_TEMPLATE = '{имя}, добрый день! Напоминаю о записи {дата} в {время} на {услуга}. Если планы изменились — напишите, пожалуйста.';

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function isoDate(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function pad2(n) { return String(n).padStart(2, '0'); }
function shiftDate(iso, days) {
  const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + days);
  return isoDate(d);
}
function fmtDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  const m = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return d.getDate() + ' ' + m[d.getMonth()];
}
function fmtDateFull(iso) {
  const d = new Date(iso + 'T12:00:00');
  const m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return d.getDate() + ' ' + m[d.getMonth()];
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  return fmtDate(isoDate(d)) + ', ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function fmtMoney(n) { return (n||0).toLocaleString('ru-RU') + ' ₽'; }
function fmtDur(sec) {
  const s = Math.max(0, Math.round(sec));
  return Math.floor(s/60) + ':' + pad2(s%60);
}
function fmtBytes(b) {
  if (b < 1024) return b + ' Б';
  if (b < 1024*1024) return (b/1024).toFixed(0) + ' КБ';
  return (b/1024/1024).toFixed(1) + ' МБ';
}
function monthKey(iso) { return iso.slice(0,7); }
function uid() { return Math.random().toString(36).slice(2,9); }
function esc(s) { return String(s||'').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function plural(n,a,b,c) {
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return a;
  if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return b;
  return c;
}
function weekdayShort(iso) {
  const d = new Date(iso + 'T12:00:00');
  return ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()];
}
function toast(text) {
  const t = document.createElement('div');
  t.textContent = text;
  t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1c1f24;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:100;';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

function loadDB() {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (!parsed.settings) parsed.settings = {};
      if (!parsed.settings.reminderTemplate) parsed.settings.reminderTemplate = DEFAULT_TEMPLATE;
      return parsed;
    } catch(e){}
  }
  const d = seed(); saveDB(d); return d;
}
function saveDB(x) { localStorage.setItem(LS_KEY, JSON.stringify(x)); }
function seed() {
  const t = todayISO();
  const d = n => shiftDate(t, n);
  return {
    settings: { reminderTemplate: DEFAULT_TEMPLATE },
    clients: [
      {id:'c1', name:'Анна Ковалёва', phone:'+79991234567', tg:'@anna_tg', notes:'Любит квадрат, аллергия на гель-лак X'},
      {id:'c2', name:'Мария Смирнова', phone:'+79992223344', tg:'@maria_s', notes:''},
      {id:'c3', name:'Ольга Петрова', phone:'+79995556677', tg:'', notes:'Приходит с ребёнком'},
    ],
    appointments: [
      {id:'a1', clientId:'c1', service:'Маникюр', price:2500, date:d(0), time:'10:00', paid:true, reminderOn:true, reminderSent:true},
      {id:'a2', clientId:'c2', service:'Брови', price:1800, date:d(0), time:'12:30', paid:false, reminderOn:true, reminderSent:false},
      {id:'a3', clientId:'c3', service:'Маникюр', price:2500, date:d(0), time:'15:00', paid:false, reminderOn:true, reminderSent:true},
      {id:'a4', clientId:'c1', service:'Маникюр', price:2500, date:d(1), time:'11:00', paid:false, reminderOn:true, reminderSent:false},
    ]
  };
}

function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE, { keyPath:'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbAdd(note) {
  return new Promise((res, rej) => {
    const tx = idb.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(note);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
function idbGetAll() {
  return new Promise((res, rej) => {
    const tx = idb.transaction(IDB_STORE, 'readonly');
    const r = tx.objectStore(IDB_STORE).getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
}
function idbDelete(id) {
  return new Promise((res, rej) => {
    const tx = idb.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

const MONTHS_GEN = {
  'января':1,'февраля':2,'марта':3,'апреля':4,'мая':5,'июня':6,
  'июля':7,'августа':8,'сентября':9,'октября':10,'ноября':11,'декабря':12
};
const WEEKDAY_PATTERNS = [
  { re: /в\s+понедельник/, wd: 1 },
  { re: /в\s+вторник/, wd: 2 },
  { re: /в\s+сред/, wd: 3 },
  { re: /в\s+четверг/, wd: 4 },
  { re: /в\s+пятниц/, wd: 5 },
  { re: /в\s+суббот/, wd: 6 },
  { re: /в\s+воскресень/, wd: 0 },
];
const NUM_WORDS = [
  ['одиннадцать',11],['двенадцать',12],['тринадцать',13],['четырнадцать',14],
  ['пятнадцать',15],['шестнадцать',16],['семнадцать',17],['восемнадцать',18],
  ['девятнадцать',19],['двадцать',20],
  ['десять',10],['девять',9],['восемь',8],['семь',7],['шесть',6],['пять',5],
  ['четыре',4],['три',3],['два',2],['две',2],['одна',1],['один',1],['одну',1]
];
const SERVICES = ['маникюр','педикюр','брови','ресницы','стрижка','окрашивание','массаж','эпиляция','шугаринг','укладка','макияж'];
const SERVICE_PRICES = {
  'маникюр':2500,'педикюр':3000,'брови':1800,'ресницы':2500,
  'стрижка':2000,'окрашивание':5000,'массаж':3000,
};

function parseVoice(text) {
  const result = { name:null, service:null, price:null, date:null, time:null, rawText:text };
  const lower = text.toLowerCase().replace(/ё/g,'е');
  const today = new Date(); today.setHours(0,0,0,0);
  const hasMorning = /утра|ночи/.test(lower);
  let m = lower.match(/в\s+(\d{1,2}):(\d{2})/);
  if (m) {
    let h = +m[1];
    if (h < 8 && !hasMorning) h += 12;
    result.time = pad2(h) + ':' + m[2];
  } else {
    m = lower.match(/в\s+(\d{1,2})(?!\d)/);
    if (m) {
      let h = +m[1];
      if (h < 8 && !hasMorning) h += 12;
      result.time = pad2(h) + ':00';
    } else {
      for (const [word, num] of NUM_WORDS) {
        const re = new RegExp('в\\s+' + word + '(?:\\s+час[а-я]*)?(?=\\s|,|$)');
        if (re.test(lower)) {
          let h = num;
          if (h < 8 && !hasMorning) h += 12;
          result.time = pad2(h) + ':00';
          break;
        }
      }
    }
  }
  if (/послезавтра/.test(lower)) {
    result.date = isoDate(addDays(today, 2));
  } else if (/завтра/.test(lower)) {
    result.date = isoDate(addDays(today, 1));
  } else if (/сегодня/.test(lower)) {
    result.date = isoDate(today);
  } else {
    let dm = lower.match(/(\d{1,2})\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)/);
    if (dm) {
      const d = +dm[1], mo = MONTHS_GEN[dm[2]];
      let year = today.getFullYear();
      let cand = new Date(year, mo - 1, d);
      if (cand < today) cand = new Date(year + 1, mo - 1, d);
      result.date = isoDate(cand);
    } else {
      for (const {re, wd} of WEEKDAY_PATTERNS) {
        if (re.test(lower)) {
          let diff = (wd - today.getDay() + 7) % 7;
          if (diff === 0) diff = 7;
          result.date = isoDate(addDays(today, diff));
          break;
        }
      }
    }
  }
  for (const s of SERVICES) {
    if (lower.includes(s)) {
      result.service = s[0].toUpperCase() + s.slice(1);
      result.price = SERVICE_PRICES[s] || null;
      break;
    }
  }
  const chunks = text.split(',').map(x => x.trim()).filter(Boolean);
  if (chunks.length) {
    const firstWord = chunks[0].split(/\s+/)[0];
    if (firstWord && /^[А-ЯЁA-Z]/.test(firstWord)) result.name = firstWord;
  }
  return result;
}

function render() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = [
    {id:'today', ico:'📋', label:'Сегодня'},
    {id:'clients', ico:'👥', label:'Клиенты'},
    {id:'money', ico:'💰', label:'Деньги'},
    {id:'settings', ico:'⚙️', label:'Настройки'},
  ].map(t => `<button data-tab="${t.id}" class="${state.tab===t.id?'active':''}"><span class="ico">${t.ico}</span>${t.label}</button>`).join('');

  const header = document.getElementById('header');
  const view = document.getElementById('view');
  if (state.tab === 'today') renderToday(header, view);
  else if (state.tab === 'clients') renderClients(header, view);
  else if (state.tab === 'money') renderMoney(header, view);
  else renderSettings(header, view);
}

function apptCard(a) {
  const c = db.clients.find(x => x.id === a.clientId);
  const chips = [];
  chips.push(a.paid ? '<span class="chip green">✅ оплачено</span>' : '<span class="chip orange">⏳ не оплачено</span>');
  if (a.reminderSent) chips.push('<span class="chip gray">📩 напоминание ушло</span>');
  return `<div class="card" data-appt="${a.id}">
    <div class="top">
      <div class="time">${a.time}</div>
      <div class="name">${esc(c?c.name:'Без имени')}</div>
      <div class="price">${fmtMoney(a.price)}</div>
    </div>
    <div class="sub">${esc(a.service)}</div>
    <div class="chips">${chips.join('')}</div>
  </div>`;
}

function renderWeekStrip() {
  const today = todayISO();
  let html = '<div class="week-strip" id="week-strip">';
  for (let i = 0; i < 7; i++) {
    const iso = shiftDate(today, i);
    const cnt = db.appointments.filter(a => a.date === iso).length;
    const dow = new Date(iso + 'T12:00:00').getDay();
    const isWeekend = dow === 0 || dow === 6;
    const cls = [
      'day-btn',
      iso === state.date ? 'active' : '',
      iso === today ? 'today' : '',
      isWeekend ? 'weekend' : ''
    ].filter(Boolean).join(' ');
    const label = i === 0 ? 'Сег' : weekdayShort(iso);
    html += `<button class="${cls}" data-day="${iso}">
      <span class="wd">${label}</span>
      <span class="d">${new Date(iso+'T12:00:00').getDate()}</span>
      <span class="cnt">${cnt ? cnt : ''}</span>
    </button>`;
  }
  html += '</div>';
  return html;
}

function renderToday(header, view) {
  header.innerHTML = `<h1>Записи</h1><button class="hdr-add-btn" id="hdr-add" title="Новая запись"><span class="plus">+</span> Запись</button>`;
  document.getElementById('hdr-add').onclick = () => openNewAppt(null);

  const date = state.date;
  const list = db.appointments.filter(a => a.date === date).sort((x,y)=>x.time.localeCompare(y.time));
  const total = list.reduce((s,a)=>s+(a.price||0),0);
  const isToday = date === todayISO();
  const dateLabel = isToday ? 'Сегодня, ' + fmtDate(date) : fmtDateFull(date);

  const tomorrow = shiftDate(todayISO(), 1);
  const toRemind = db.appointments.filter(a => a.date === tomorrow && a.reminderOn && !a.reminderSent);
  let remindBlock = '';
  if (toRemind.length) {
    const items = toRemind.map(a => {
      const c = db.clients.find(x => x.id === a.clientId);
      return `<div class="remind-item">
        <span class="who">${esc(c?c.name:'—')} · ${a.time} · ${esc(a.service)}</span>
        <button data-remind="${a.id}">Напомнить</button>
      </div>`;
    }).join('');
    remindBlock = `<div class="remind-block">
      <div class="t">🔔 КОМУ НАПОМНИТЬ СЕГОДНЯ (записи на завтра)</div>
      ${items}
    </div>`;
  }

  view.innerHTML = `
    ${renderWeekStrip()}
    <div class="datebar"><div class="label">${dateLabel}</div></div>
    <button class="voice-hero" id="voice-hero">
      <span class="vh-text">
        <span class="vh-title">Создать запись голосом</span>
        <span class="vh-hint">Скажи: «Анна, маникюр, завтра в десять»</span>
      </span>
      <span class="vh-icon">🎤</span>
    </button>
    ${remindBlock}
    <div class="list">
      ${list.length ? list.map(apptCard).join('') : `<div class="empty">На этот день записей нет.<br>Нажмите «+ Запись» вверху или «Создать запись голосом»</div>`}
    </div>
    ${list.length ? `<div class="summary"><span>${list.length} ${plural(list.length,'запись','записи','записей')} на день</span><b>${fmtMoney(total)}</b></div>` : ''}
  `;
  view.querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
    state.date = b.dataset.day; render();
  });
  view.querySelectorAll('[data-appt]').forEach(el => el.onclick = () => openApptSheet(el.dataset.appt));
  view.querySelectorAll('[data-remind]').forEach(b => b.onclick = (e) => {
    e.stopPropagation(); openSendReminder(b.dataset.remind);
  });
  document.getElementById('voice-hero').onclick = openVoiceAdmin;
  const active = view.querySelector('.day-btn.active');
  if (active) active.scrollIntoView({ inline:'center', block:'nearest' });
}

function renderClients(header, view) {
  if (state.clientId) return renderClientCard(header, view);
  header.innerHTML = `<h1>Клиенты</h1>`;
  view.innerHTML = `
    <div class="list">
      ${db.clients.length ? db.clients.map(c => {
        const appts = db.appointments.filter(a => a.clientId === c.id);
        const last = [...appts].sort((x,y)=> (y.date+y.time).localeCompare(x.date+x.time))[0];
        return `<div class="card client-card" data-client="${c.id}">
          <button class="client-del" data-del-client="${c.id}" title="Удалить клиента">✕</button>
          <div class="top">
            <div class="name">${esc(c.name)}</div>
          </div>
          <div class="sub">${appts.length} ${plural(appts.length,'визит','визита','визитов')}${c.phone ? ' · ' + esc(c.phone) : ''}</div>
          <div class="sub">${last ? 'Последний: ' + fmtDate(last.date) + ' · ' + esc(last.service) : 'Ещё не было визитов'}</div>
        </div>`;
      }).join('') : `<div class="empty">Клиентов пока нет</div>`}
    </div>`;
  view.querySelectorAll('[data-client]').forEach(el => el.onclick = (e) => {
    if (e.target.closest('[data-del-client]')) return;
    state.clientId = el.dataset.client; render();
  });
  view.querySelectorAll('[data-del-client]').forEach(btn => btn.onclick = (e) => {
    e.stopPropagation();
    deleteClient(btn.dataset.delClient);
  });
}

async function deleteClient(id) {
  const c = db.clients.find(x => x.id === id); if (!c) return;
  const appts = db.appointments.filter(a => a.clientId === id);
  let msg = `Удалить клиента «${c.name}»?`;
  if (appts.length) {
    msg += `\n\nВсе ${appts.length} ${plural(appts.length,'запись','записи','записей')} этого клиента тоже будут удалены.`;
  }
  if (!confirm(msg)) return;

  try {
    const voices = await idbGetAll();
    const myVoices = voices.filter(v => v.clientId === id);
    for (const v of myVoices) await idbDelete(v.id);
  } catch(e) {}

  db.appointments = db.appointments.filter(a => a.clientId !== id);
  db.clients = db.clients.filter(x => x.id !== id);
  saveDB(db);
  if (state.clientId === id) state.clientId = null;
  toast('Клиент удалён');
  render();
}

    </div>

    <div class="card">
      <div style="font-weight:600;margin-bottom:8px">История визитов</div>
      ${appts.length ? appts.map(a => `<div class="history-item"><span>${fmtDate(a.date)} · ${esc(a.service)}</span><span>${fmtMoney(a.price)}</span></div>`).join('') : `<div class="sub">Пока пусто</div>`}
    </div>

      <div class="stat-tile"><div class="k">Всего заплатил(а)</div><div class="v">${fmtMoney(paid)}</div></div>

function voiceRowHTML(v, client) {
  return `<div class="voice-card" data-vid="${v.id}">
    <div class="voice-top">
      <button class="voice-play" data-vplay="${v.id}">▶</button>
      <div class="voice-meta">
        <div class="who">${client ? esc(client.name) : 'Без клиента'}</div>
        <div class="when">${fmtDateTime(v.createdAt)} · ${fmtDur(v.duration)} · ${fmtBytes(v.size)}</div>
      </div>
      <button class="voice-del" data-vdel="${v.id}" title="Удалить">✕</button>
    </div>
  </div>`;
}

let currentAudio = null, currentAudioId = null;
function bindVoiceRows() {
  document.querySelectorAll('[data-vplay]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.vplay;
      if (currentAudio && currentAudioId === id && !currentAudio.paused) { currentAudio.pause(); return; }
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      const all = await idbGetAll();
      const v = all.find(x => x.id === id); if (!v) return;
      const url = URL.createObjectURL(v.blob);
      currentAudio = new Audio(url); currentAudioId = id;
      document.querySelectorAll('.voice-play').forEach(b => { b.classList.remove('playing'); b.textContent = '▶'; });
      btn.classList.add('playing'); btn.textContent = '❚❚';
      currentAudio.onended = () => {
        btn.classList.remove('playing'); btn.textContent = '▶';
        URL.revokeObjectURL(url); currentAudio = null; currentAudioId = null;
      };
      currentAudio.play();
    };
  });
  document.querySelectorAll('[data-vdel]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Удалить голосовую заметку?')) return;
      await idbDelete(btn.dataset.vdel);
      if (state.tab === 'settings') openAllVoices();
      else render();
    };
  });
}

async function openAllVoices() {
  const m = document.getElementById('modal');
  const voices = (await idbGetAll()).sort((a,b)=>b.createdAt - a.createdAt);
  const totalBytes = voices.reduce((s,v)=>s+(v.size||0),0);
  m.innerHTML = `
    <div class="sheet-bg" data-close-bg><div class="sheet">
      <h2>Все голосовые заметки</h2>
      <div style="color:var(--muted);font-size:13px;margin-bottom:12px">
        ${voices.length} ${plural(voices.length,'запись','записи','записей')} · ${fmtBytes(totalBytes)}
      </div>
      ${voices.length ? voices.map(v => {
        const c = v.clientId ? db.clients.find(x => x.id === v.clientId) : null;
        return voiceRowHTML(v, c);
      }).join('') : '<div class="empty">Голосовых пока нет</div>'}
      <div class="btn-row"><button class="btn ghost" data-close>Закрыть</button></div>
    </div></div>`;
  bindClose();
  bindVoiceRows();
}

function closeModal() { document.getElementById('modal').innerHTML = ''; }
function bindClose() {
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  const bg = document.querySelector('[data-close-bg]');
  if (bg) bg.onclick = e => { if (e.target === bg) closeModal(); };
}

function openApptSheet(id) {
  const a = db.appointments.find(x => x.id === id); if (!a) return;
  const c = db.clients.find(x => x.id === a.clientId);
  const m = document.getElementById('modal');
  m.innerHTML = `
    <div class="sheet-bg" data-close-bg><div class="sheet">
      <h2>${esc(c?c.name:'Без имени')} · ${a.time}</h2>
      <div class="kv"><span class="k">Услуга</span><span class="v">${esc(a.service)}</span></div>
      <div class="kv"><span class="k">Цена</span><span class="v">${fmtMoney(a.price)}</span></div>
      <div class="kv"><span class="k">Дата</span><span class="v">${fmtDateFull(a.date)}</span></div>
      <div class="kv"><span class="k">Оплата</span><span class="v">${a.paid?'Оплачено':'Не оплачено'}</span></div>
      <div class="kv"><span class="k">Напоминание</span><span class="v">${a.reminderOn ? (a.reminderSent?'Отправлено':'Запланировано') : 'Выключено'}</span></div>
      <div class="actions">
        <button class="btn primary small" data-act="toggle-paid">${a.paid?'Отметить неоплаченным':'✅ Отметить оплаченным'}</button>
        <button class="btn ghost small" data-act="edit">✏️ Редактировать</button>
        ${a.reminderOn && !a.reminderSent && c ? `<button class="btn ghost small" data-act="send-reminder">📩 Отправить напоминание</button>` : ''}
        ${c ? `<button class="btn ghost small" data-act="open-client">👤 Карточка клиента</button>` : ''}
        <button class="btn danger small" data-act="delete">Удалить запись</button>
      </div>
      <div class="btn-row"><button class="btn ghost" data-close>Закрыть</button></div>
    </div></div>`;
  bindClose();
  m.querySelector('[data-act="toggle-paid"]').onclick = () => { a.paid = !a.paid; saveDB(db); closeModal(); render(); };
  m.querySelector('[data-act="edit"]').onclick = () => { closeModal(); openEditAppt(id); };
  const r = m.querySelector('[data-act="send-reminder"]');
  if (r) r.onclick = () => { closeModal(); openSendReminder(id); };
  const oc = m.querySelector('[data-act="open-client"]');
  if (oc) oc.onclick = () => { closeModal(); state.tab='clients'; state.clientId=c.id; render(); };
  m.querySelector('[data-act="delete"]').onclick = () => {
    if (!confirm('Удалить запись?')) return;
    db.appointments = db.appointments.filter(x => x.id !== id); saveDB(db); closeModal(); render();
  };
}

function buildReminderText(a, c) {
  const tpl = (db.settings && db.settings.reminderTemplate) || DEFAULT_TEMPLATE;
  const name = c ? c.name.split(' ')[0] : '';
  return tpl
    .replace(/\{имя\}/g, name)
    .replace(/\{дата\}/g, fmtDateFull(a.date))
    .replace(/\{время\}/g, a.time)
    .replace(/\{услуга\}/g, a.service)
    .replace(/\{цена\}/g, fmtMoney(a.price));
}

function openSendReminder(apptId) {
  const a = db.appointments.find(x => x.id === apptId); if (!a) return;
  const c = db.clients.find(x => x.id === a.clientId);
  if (!c) { alert('У записи нет клиента'); return; }
  const text = buildReminderText(a, c);
  const phone = (c.phone || '').replace(/[^\d]/g, '');
  const tgUser = (c.tg || '').replace('@','');
  const m = document.getElementById('modal');

  const waLink = phone ? `https://wa.me/${phone}?text=${encodeURIComponent(text)}` : null;
  const tgLink = tgUser ? `https://t.me/${tgUser}` : null;
  const smsLink = phone ? `sms:${c.phone}?body=${encodeURIComponent(text)}` : null;

  const waBlock = waLink
    ? `<a class="btn primary" href="${waLink}" target="_blank" data-act="wa" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-bottom:8px;background:#25d366">🟢 WhatsApp</a>`
    : `<button class="btn primary" data-act="no-phone" style="background:#25d366;margin-bottom:8px;opacity:.55">🟢 WhatsApp — нет телефона</button>`;

  const tgBlock = tgLink
    ? `<button class="btn primary" data-act="tg" style="background:#2796d4;margin-bottom:8px">✈️ Telegram</button>`
    : `<button class="btn primary" data-act="no-tg" style="background:#2796d4;margin-bottom:8px;opacity:.55">✈️ Telegram — нет ника</button>`;

  const smsBlock = smsLink
    ? `<a class="btn primary" href="${smsLink}" data-act="sms" style="display:flex;align-items:center;justify-content:center;text-decoration:none;background:#8a909a;margin-bottom:8px">💬 SMS</a>`
    : `<button class="btn primary" data-act="no-phone" style="background:#8a909a;margin-bottom:8px;opacity:.55">💬 SMS — нет телефона</button>`;

  m.innerHTML = `
    <div class="sheet-bg" data-close-bg><div class="sheet">
      <h2>Отправить напоминание</h2>
      <div class="row" style="background:#f6f7f9;padding:10px;border-radius:10px;font-size:13px;white-space:pre-wrap">${esc(text)}</div>
      <div style="color:var(--muted);font-size:12px;margin:6px 0 14px">Кому: ${esc(c.name)}${c.phone?' · '+esc(c.phone):''}${c.tg?' · '+esc(c.tg):''}</div>

      ${waBlock}
      ${tgBlock}
      ${smsBlock}
      <button class="btn primary" data-act="max" style="background:#ff5b22;margin-bottom:8px">🟠 MAX</button>
      <button class="btn ghost" data-act="copy" style="margin-bottom:8px">📋 Копировать текст</button>

      <div class="btn-row">
        <button class="btn ghost" data-close>Отмена</button>
        <button class="btn primary" data-act="mark-sent">✅ Отметить как отправленное</button>
      </div>
    </div></div>`;
  bindClose();

  const markSent = () => { a.reminderSent = true; saveDB(db); };

  const copyText = async () => {
    try { await navigator.clipboard.writeText(text); return true; }
    catch(e) {
      const tmp = document.createElement('textarea');
      tmp.value = text; document.body.appendChild(tmp); tmp.select();
      try { document.execCommand('copy'); } catch(e2){}
      tmp.remove(); return true;
    }
  };

  // "нет телефона" — предложить заполнить карточку
  m.querySelectorAll('[data-act="no-phone"]').forEach(btn => btn.onclick = () => {
    if (confirm('У клиента не указан телефон.\n\nОткрыть карточку, чтобы заполнить?')) {
      closeModal();
      state.tab = 'clients';
      state.clientId = c.id;
      render();
    }
  });

  // "нет ника Telegram"
  const noTg = m.querySelector('[data-act="no-tg"]');
  if (noTg) noTg.onclick = () => {
    if (confirm('У клиента не указан Telegram.\n\nОткрыть карточку, чтобы заполнить?')) {
      closeModal();
      state.tab = 'clients';
      state.clientId = c.id;
      render();
    }
  };

  const waEl = m.querySelector('[data-act="wa"]');
  if (waEl) waEl.onclick = () => {
    markSent();
    closeModal();
    render();
  };

  const smsEl = m.querySelector('[data-act="sms"]');
  if (smsEl) smsEl.onclick = () => {
    markSent();
    closeModal();
    render();
  };

  const tgBtn = m.querySelector('[data-act="tg"]');
  if (tgBtn) tgBtn.onclick = async () => {
    await copyText();
    markSent();
    closeModal();
    render();
    window.open(tgLink, '_blank');
  };

  m.querySelector('[data-act="max"]').onclick = async () => {
    await copyText();
    markSent();
    closeModal();
    render();
    window.open('https://max.ru', '_blank');
  };

  m.querySelector('[data-act="copy"]').onclick = async () => {
    await copyText();
    alert('Текст скопирован');
  };

  m.querySelector('[data-act="mark-sent"]').onclick = () => {
    markSent();
    closeModal();
    render();
  };
}

function openVoiceAdmin() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const m = document.getElementById('modal');

  m.innerHTML = `
    <div class="sheet-bg" data-close-bg><div class="sheet">
      <h2>Голосом создать запись</h2>
      ${SR ? `
        <div class="voice-rec">
          <button class="rec-circle" id="va-btn">🎤</button>
          <div class="rec-timer" id="va-timer">0:00</div>
          <div class="rec-hint" id="va-hint">Нажмите и говорите. Работает до нажатия ■</div>
        </div>
        <div class="row" id="va-transcript-row" style="display:none">
          <label>Что услышали</label>
          <div class="transcript-box" id="va-transcript"></div>
        </div>
        <div class="row">
          <label>Или введите текстом</label>
          <input id="va-text" placeholder="Анна, маникюр, завтра в десять">
        </div>
      ` : `
        <div class="err-box">Браузер не поддерживает распознавание речи. Откройте в Chrome на Android или введите текстом.</div>
        <div class="row"><label>Текст</label><input id="va-text" placeholder="Анна, маникюр, завтра в десять"></div>
      `}
      <div class="btn-row">
        <button class="btn ghost" data-close>Отмена</button>
        <button class="btn primary" id="va-parse">Разобрать</button>
      </div>
    </div></div>`;
  bindClose();

  let recognition = null;
  let listening = false;
  let timerInt = null;
  let startTs = 0;
  let accumulated = '';
  let restartTimeout = null;

  const btn = document.getElementById('va-btn');
  const timerEl = document.getElementById('va-timer');
  const hintEl = document.getElementById('va-hint');
  const transcriptRow = document.getElementById('va-transcript-row');
  const transcriptEl = document.getElementById('va-transcript');
  const textInput = document.getElementById('va-text');

  function stopTimer() {
    clearInterval(timerInt);
    timerInt = null;
  }

  function updateTranscript() {
    transcriptRow.style.display = '';
    const txt = accumulated.trim();
    transcriptEl.textContent = txt || '…';
    if (txt) textInput.value = txt;
  }

  function startRecognition() {
    recognition = new SR();
    recognition.lang = 'ru-RU';
    recognition.continuous = true;
    recognition.interimResults = true;

    let sessionFinal = '';

    recognition.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) sessionFinal += t;
        else interim += t;
      }
      transcriptRow.style.display = '';
      transcriptEl.textContent = (accumulated + sessionFinal + interim).trim() || '…';
    };

    recognition.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        hintEl.innerHTML = `<span style="color:var(--red)">Нет доступа к микрофону. Разрешите доступ.</span>`;
        stopAll();
        return;
      }
      if (e.error === 'audio-capture') {
        hintEl.innerHTML = `<span style="color:var(--red)">Микрофон не найден.</span>`;
        stopAll();
        return;
      }
    };

    recognition.onend = () => {
      if (sessionFinal) accumulated += sessionFinal;
      sessionFinal = '';
      updateTranscript();
      if (listening) {
        restartTimeout = setTimeout(() => {
          if (!listening) return;
          try { startRecognition(); }
          catch(e) {
            hintEl.innerHTML = `<span style="color:var(--red)">Сбой распознавания. Нажмите ■ и попробуйте снова.</span>`;
            stopAll();
          }
        }, 150);
      }
    };

    try {
      recognition.start();
    } catch(e) {
      restartTimeout = setTimeout(() => {
        if (listening) { try { startRecognition(); } catch(e2) { stopAll(); } }
      }, 200);
    }
  }

  function stopAll() {
    listening = false;
    stopTimer();
    if (restartTimeout) { clearTimeout(restartTimeout); restartTimeout = null; }
    if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
    if (btn) { btn.classList.remove('recording'); btn.textContent = '🎤'; }
  }

  if (SR && btn) {
    btn.onclick = () => {
      if (listening) {
        stopAll();
        hintEl.textContent = 'Готово. Нажмите «Разобрать» или запишите заново.';
        return;
      }
      listening = true;
      accumulated = '';
      textInput.value = '';
      transcriptRow.style.display = 'none';
      transcriptEl.textContent = '';
      startTs = Date.now();
      btn.classList.add('recording');
      btn.textContent = '■';
      hintEl.textContent = 'Слушаю… Говорите. Нажмите ■, чтобы остановить.';
      stopTimer();
      timerInt = setInterval(() => {
        timerEl.textContent = fmtDur((Date.now() - startTs) / 1000);
      }, 200);
      startRecognition();
    };
  }

  document.getElementById('va-parse').onclick = () => {
    if (listening) stopAll();
    const text = (textInput.value || '').trim();
    if (!text) { alert('Скажите или введите фразу'); return; }
    openVoiceDraft(parseVoice(text));
  };

  document.querySelectorAll('[data-close]').forEach(b => {
    b.addEventListener('click', () => { if (listening) stopAll(); }, { once: true });
  });
  const bg = document.querySelector('[data-close-bg]');
  if (bg) {
    bg.addEventListener('click', (e) => {
      if (e.target === bg && listening) stopAll();
    });
  }
}

  const nameInput = document.getElementById('vd-name');

    const q = nameInput.value.trim().toLowerCase();

      hintEl.className = 'hint-green';
      hintEl.textContent = '✓ Найден: ' + found.name;

      hintEl.className = 'hint-muted';
      hintEl.textContent = q ? 'Новый клиент — будет создан' : 'Введите имя';

      paid:false, reminderOn, reminderSent:false
    });
    saveDB(db);
    state.date = date;
    state.tab = 'today';
    closeModal();
    render();
  };
}

function pickMimeType() {
  const types = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  for (const t of types) if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  return '';
}

      <div class="voice-rec">
        <button class="rec-circle" id="rec-btn">🎤</button>
        <div class="rec-timer" id="rec-timer">0:00</div>
        <div class="rec-hint" id="rec-hint">Нажмите на микрофон и говорите</div>
      </div>
      <div class="row" id="row-client" style="${prefillClientId?'display:none':''}">
        <label>Привязать к клиенту (необязательно)</label>
        <select id="rec-client"><option value="">— без клиента —</option>${clientOpts}</select>
      </div>
      <div class="actions">
        <button class="btn primary small" id="rec-save" style="display:none">💾 Сохранить</button>
        <button class="btn ghost small" id="rec-rerecord" style="display:none">↻ Записать заново</button>
      </div>
      <div class="btn-row"><button class="btn ghost" data-close>Закрыть</button></div>
    </div></div>`;
  bindClose();

  const btn = document.getElementById('rec-btn');
  const timer = document.getElementById('rec-timer');
  const hint = document.getElementById('rec-hint');
  const saveBtn = document.getElementById('rec-save');
  const reBtn = document.getElementById('rec-rerecord');
  const rowClient = document.getElementById('row-client');

  let st = { mediaRecorder:null, stream:null, chunks:[], startTs:0, blob:null, mimeType:'', timerInt:null, duration:0 };

  function reset() {
    st = { mediaRecorder:null, stream:null, chunks:[], startTs:0, blob:null, mimeType:'', timerInt:null, duration:0 };
    btn.classList.remove('recording');
    btn.textContent = '🎤';
    timer.textContent = '0:00';
    hint.textContent = 'Нажмите на микрофон и говорите';
    saveBtn.style.display = 'none';
    reBtn.style.display = 'none';
    rowClient.style.display = prefillClientId ? 'none' : '';
  }
  reset();

  btn.onclick = async () => {
    if (st.mediaRecorder && st.mediaRecorder.state === 'recording') { st.mediaRecorder.stop(); return; }
    if (st.blob) reset();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      st.stream = stream;
      const mimeType = pickMimeType();
      st.mimeType = mimeType || 'audio/webm';
      const mr = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      st.mediaRecorder = mr;
      st.chunks = [];
      mr.ondataavailable = e => { if (e.data && e.data.size > 0) st.chunks.push(e.data); };
      mr.onstop = () => {
        clearInterval(st.timerInt);
        st.duration = (Date.now() - st.startTs) / 1000;
        st.blob = new Blob(st.chunks, { type: st.mimeType });
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('recording');
        btn.textContent = '▶';
        hint.textContent = `Записано ${fmtDur(st.duration)} · ${fmtBytes(st.blob.size)}`;
        saveBtn.style.display = '';
        reBtn.style.display = '';
        btn.onclick = () => {
          const url = URL.createObjectURL(st.blob);
          const a = new Audio(url);
          a.onended = () => URL.revokeObjectURL(url);
          a.play();
        };
      };
      mr.start();
      st.startTs = Date.now();
      btn.classList.add('recording');
      btn.textContent = '■';
      hint.textContent = 'Идёт запись… Нажмите ■, чтобы остановить';
      st.timerInt = setInterval(() => { timer.textContent = fmtDur((Date.now()-st.startTs)/1000); }, 200);
    } catch (err) {
      hint.innerHTML = `<span style="color:var(--red)">Нет доступа к микрофону.</span>`;
    }
  };

  reBtn.onclick = () => reset();

  saveBtn.onclick = async () => {
    if (!st.blob) return;
    const sel = document.getElementById('rec-client');
    const clientId = (prefillClientId || (sel ? sel.value : '')) || null;
    try {
      await idbAdd({
        id: uid(), blob: st.blob, mimeType: st.mimeType, clientId,
        createdAt: Date.now(), duration: st.duration, size: st.blob.size,
      });
      closeModal();
      if (state.tab === 'clients' && state.clientId === clientId) render();
      else {
        toast('Заметка сохранена');
      }
    } catch (e) { alert('Не удалось сохранить: ' + e.message); }
  };
}

document.getElementById('tabs').onclick = e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  const newTab = b.dataset.tab;
  state.tab = newTab;
  state.clientId = null;
  if (newTab === 'today') state.date = todayISO();
  render();
};

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.tab === 'today') {
    render();
  }
});

(async () => {
  db = loadDB();
  state.date = todayISO();
  try { idb = await openIDB(); } catch(e) { console.error('IndexedDB недоступен', e); }
  render();
  if ('serviceWorker' in navigator) {
    try { await navigator.serviceWorker.register('/my-crm/sw.js'); } catch(e) {}
  }
})();
</script>
</body>
</html>
